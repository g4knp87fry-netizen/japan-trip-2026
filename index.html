<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2026 冬日日本行｜日光・長野・東京</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF6;--paper:#FDF8F0;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--blue:#A8D3E6;--green:#B9DAA5;--radius:22px;--border:3px solid var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Huninn',"Noto Sans TC",sans-serif;background:var(--bg);background-image:radial-gradient(circle at 20% 30%,rgba(242,164,151,0.08) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(168,211,230,0.08) 0%,transparent 40%);color:var(--ink);line-height:1.65;padding-bottom:80px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
nav{position:fixed;top:0;left:0;right:0;background:var(--bg);border-bottom:var(--border);z-index:100;display:flex;justify-content:space-around;padding:10px 8px;gap:4px}
nav a{text-decoration:none;color:var(--ink);font-size:13px;padding:6px 10px;border-radius:999px;border:2px solid transparent;white-space:nowrap}
nav a:hover{background:var(--yellow);border-color:var(--ink)}
main{padding:70px 16px 40px;max-width:640px;margin:0 auto}
.card{background:var(--paper);border:var(--border);border-radius:var(--radius);padding:22px 20px;margin-bottom:24px;box-shadow:4px 4px 0 var(--ink);position:relative}
.card::after{content:"";position:absolute;top:6px;right:8px;width:18px;height:18px;border:2px solid var(--ink);border-radius:50%;opacity:0.15}
h1,h2,h3{font-weight:normal}h1{font-size:1.85rem;text-align:center;margin-bottom:8px;letter-spacing:0.02em}h2{font-size:1.3rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--coral);border:2.5px solid var(--ink);flex-shrink:0}
#home{text-align:center}.hero-illust{width:220px;height:180px;margin:0 auto 16px;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.countdown{display:inline-block;background:var(--blue);border:var(--border);border-radius:999px;padding:8px 20px;font-size:1.1rem;margin:12px 0 20px}
.flight-card{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--yellow);border:var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.flight-card .airport{font-size:0.9rem}.flight-card .time{font-size:1.3rem;font-weight:bold}.flight-card .mid{text-align:center;font-size:0.85rem}.flight-card .airline{font-size:0.8rem;opacity:0.8}
.hotel-item{border-left:6px solid var(--green);padding:10px 0 10px 16px;margin-bottom:14px;background:rgba(185,218,165,0.12);border-radius:0 12px 12px 0}
.hotel-item h3{font-size:1.08rem;margin-bottom:4px}.hotel-meta{font-size:0.9rem;opacity:0.88;line-height:1.55}
.day-radios{position:absolute;opacity:0;pointer-events:none}
.date-tabs{display:flex;overflow-x:auto;gap:8px;padding-bottom:12px;margin-bottom:16px;scrollbar-width:none}.date-tabs::-webkit-scrollbar{display:none}
.date-tab{flex:0 0 auto;border:var(--border);border-radius:999px;padding:8px 14px;background:var(--bg);cursor:pointer;font-size:0.9rem;transition:transform 0.2s,background 0.2s;user-select:none}
#d0:checked~.date-tabs label[for=d0],#d1:checked~.date-tabs label[for=d1],#d2:checked~.date-tabs label[for=d2],#d3:checked~.date-tabs label[for=d3],#d4:checked~.date-tabs label[for=d4],#d5:checked~.date-tabs label[for=d5],#d6:checked~.date-tabs label[for=d6],#d7:checked~.date-tabs label[for=d7],#d8:checked~.date-tabs label[for=d8],#d9:checked~.date-tabs label[for=d9],#d10:checked~.date-tabs label[for=d10],#d11:checked~.date-tabs label[for=d11],#d12:checked~.date-tabs label[for=d12]{background:var(--coral);transform:scale(1.05)}
.day-content{display:none}
#d0:checked~#day-0,#d1:checked~#day-1,#d2:checked~#day-2,#d3:checked~#day-3,#d4:checked~#day-4,#d5:checked~#day-5,#d6:checked~#day-6,#d7:checked~#day-7,#d8:checked~#day-8,#d9:checked~#day-9,#d10:checked~#day-10,#d11:checked~#day-11,#d12:checked~#day-12{display:block;animation:bounceIn 0.4s ease}
@keyframes bounceIn{0%{transform:scale(0.95);opacity:0}50%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
.timeline{position:relative;padding-left:20px}.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:2px}
.tl-item{position:relative;margin-bottom:18px;padding-left:16px}.tl-item::before{content:"";position:absolute;left:-17px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.tl-item.must::before{background:var(--coral)}.tl-time{font-size:0.85rem;opacity:0.7;margin-bottom:2px}.tl-title{font-size:1.05rem}
.must-badge{display:inline-block;background:var(--coral);color:var(--ink);font-size:0.7rem;padding:1px 6px;border-radius:999px;border:1.5px solid var(--ink);margin-left:6px;vertical-align:middle}
.tag{display:inline-block;font-size:0.75rem;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink);margin-right:4px;margin-top:4px}
.tag.train{background:var(--blue)}.tag.bus{background:var(--yellow)}.tag.walk{background:var(--green)}.tag.food{background:var(--coral)}
.todo-list{list-style:none}.todo-list li{margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}.todo-list input[type=checkbox]{margin-top:4px;width:18px;height:18px;accent-color:var(--coral)}
footer{text-align:center;font-size:0.85rem;opacity:0.6;margin-top:40px}a{color:inherit}
</style>
</head>
